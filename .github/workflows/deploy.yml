# Builds the story and publishes it to GitHub Pages.
#
# Runs automatically every time you push to the "main" branch (that includes
# editing a file in the GitHub web interface and clicking "Commit changes").
# You can also run it by hand from the Actions tab ("Run workflow").

name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# If several pushes land quickly, only the newest deploy runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # When the story is read from a Google Doc ([site] content_url), the
      # downloaded copy is saved as content.remote.md (and pasted pictures as
      # assets/pasted/*) and committed here so it stays the fallback for
      # future builds.
      - name: Save the downloaded Google Doc copy
        run: |
          git add --all content.remote.md assets/pasted 2>/dev/null || true
          if [ -n "$(git status --porcelain content.remote.md assets/pasted)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update story from Google Doc"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # Turns on GitHub Pages for this repository automatically, so you do
          # not have to visit Settings > Pages yourself.
          enablement: true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
